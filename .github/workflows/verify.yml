name: Verify Intelligent Contract (manual, no network writes)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install official SDK and GenVM linter
        run: |
          python -m pip install "genlayer-py==0.16.3" "genlayer-test==0.29.2" "genvm-linter==0.11.0" "pytest>=8,<9"
      - name: Python syntax
        run: python -m compileall -q contracts tests
      - name: Official GenLayer SDK Direct tests
        run: python -m pytest -q tests/sdk
      - name: GenVM lint
        run: genvm-lint check contracts/*.py
      - name: Offline state-machine regression
        run: python -m pytest -q tests/offline
